<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freuency Count</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            width: 250px;
        }
        button {
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        </style>
</head>
<body>
    <h1>String Tools</h1>

    <input type="text" id="userInput" placeholder="Enter text here">

    <br>

    <button onclick="checkFrequency()">Check Frequency Count</button>
    

    <div class="result" id="output"></div>
</body>
<script>
    function checkFrequency(){
        let input = document.getElementById("userInput").value;
        input = input.toLowerCase(); // case insensitive
        const freq = {};

        for(let char of input){
            if(char !== " " && char >= "a" && char <= "z"){
                freq[char] = (freq[char] || 0) + 1;
            }
        } 

        //display the output
         let output = document.getElementById("output");
         output.innerHTML = "";

         //loop through the object
         for(let key in freq){
            const p = document.createElement("p");
            p.textContent = `${key} : ${freq[key]}`;
            output.appendChild(p);
         }
        console.log(freq);
     
    }

</script>
</html>
