<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Number</title>
<style>
    body {
      font-family: Arial, sans-serif;
      background: #0a192f;
      color: #ccd6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #112240;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    input {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      word-wrap: break-word;
      color: #64ffda;
    }
  </style>    
</head>
<body>
    <div class="container">
        <h2>Find Missing Number</h2>
        <input type="text" id="input" placeholder="Enter the array">
        <button onclick="findMissingNumber()">Find</button>
        <div id="result"></div>
    </div>
</body>
<script>
   function findMissingNumber(){
     let input = document.getElementById("input").value;
     let result = document.getElementById("result");
     
     let arr = input.split(",").map(Number);
     arr = arr.sort((a,b) => a-b);

     let missing = [];

     for(let i = 0; i< arr.length; i++){
        let current = arr[i];
        let next = arr[i+1];
        for(let j=current + 1; j < next; j++){
            missing.push(j);
        }
     }
     
     result.innerHTML = "Missing Numbers: "+ missing.join(", ");

   }
</script>
</html>
