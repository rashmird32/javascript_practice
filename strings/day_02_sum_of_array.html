<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum of an Array</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: #1e293b;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    width: 300px;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
}

input {
    border: none;
}

button {
    background: #22c55e;
    border: none;
    cursor: pointer;
    color: white;
    font-weight: bold;
    transition: 0.2s ease;
}

button:hover {
    background: #16a34a;
}
    </style>
</head>
<body>
    <div class="container">
        <h2>Sum of Array</h2>
        <input type="text"  id="arrayInput" placeholder="Enter numbers (e.g. 1,2,3,4)">
        <button onclick="calculateSum()">Find Sum</button>
        <p id="result"></p>
    </div>
</body>
<script>
    function calculateSum(){
        let input = document.getElementById("arrayInput").value;

        let arr = input.split(",").map(Number);

        let sum = arr.reduce((acc,curr) => acc + curr, 0);

        document.getElementById("result").textContent = `Sum of Array: ${sum}`;
    }
</script>
</html>
