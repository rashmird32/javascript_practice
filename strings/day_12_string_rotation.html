<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagram Checker</title>
<style>
    body {
      font-family: Arial, sans-serif;
      background: #0a192f;
      color: #ccd6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #112240;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    input {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      word-wrap: break-word;
      color: #64ffda;
    }
  </style>    
</head>
<body>
    <div class="container">
        <h2>String Rotation Checker</h2>
        <input type="text" id="input1" placeholder="Enter the first word">
        <input type="text" id="input2" placeholder="Enter the rotated word">
        <button onclick="anagramChecker()">Check</button>
        <div id="result"></div>
    </div>
</body>
<script>
   function anagramChecker(){
     let word1 = document.getElementById("input1").value;
     let word2 = document.getElementById("input2").value;
     let result = document.getElementById("result");

     let combined  = word1 + word2;

     if(word2.length !== word1.length){
        result.innerHTML  = "❌ Not an rotation";
        return;
     }

     if(combined.includes(word2)){
        result.innerHTML  = "✅ It is a rotation";
     }else{
        result.innerHTML  = "❌ Not an rotation";
     }
   }
</script>
</html>
