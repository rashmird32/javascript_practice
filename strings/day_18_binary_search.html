<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Binary Search
    </title>
<style>
    body {
      font-family: Arial, sans-serif;
      background: #0a192f;
      color: #ccd6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #112240;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    input {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      word-wrap: break-word;
      color: #64ffda;
    }
  </style>    
</head>
<body>
    <div class="container">
        <h2>Binary Search</h2>
        <input type="text" id="input" placeholder="Enter sorted numbers like 1,2,3,4,5">
        <input type="text" id="target" placeholder="Enter number to search">
        <button onclick="binarySearch()">Search</button>
        <div id="result"></div>
    </div>
</body>
<script>
   function binarySearch(){
     let input = document.getElementById("input").value;
     let result = document.getElementById("result");
     
     let arr = input.split(",").map(Number);
     let target = Number(document.getElementById("target").value);
     let left = 0;
     let right = arr.length - 1;
     let found = false;

     while(left <= right){
        let mid = Math.floor((left+right)/2);
        //If target found
        if(arr[mid] === target){
            result.textContent = `Number found at index ${mid}`;
            found = true;
            break;
        }else if(arr[mid] < target){
            left = mid + 1;
        }else{
            right = mid -1;
        }
     }
     if(!found){
        result.textContent = "Number not found";
     }
    

     
     

   }
</script>
</html>
