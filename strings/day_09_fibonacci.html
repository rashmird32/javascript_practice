<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Series</title>
 <style>
    body {
      font-family: Arial, sans-serif;
      background: #0a192f;
      color: #ccd6f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #112240;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    input {
      width: 80%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #64ffda;
      color: #0a192f;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      word-wrap: break-word;
      color: #64ffda;
    }
  </style>   
</head>
<body>
    <div class="container">
        <h2>Fibonacci Series</h2>
        <input type="text" id="input" placeholder="Enter the terms">
        <button onclick="generateFibonacce()">Generate</button>
        <p id="result"></p>
    </div>
</body>
<script>
    function generateFibonacce(){
        let n = document.getElementById("input").value;
        let fib = [0,1];
        
        for(let i=2; i<n; i++){
            fib[i] = fib[i-1] + fib[i-2];
        }
        document.getElementById("result").innerHTML = fib.slice(0,n).join(", ");
    }
</script>
</html>
