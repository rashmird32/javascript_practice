<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Non Repeating Character</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }
        input {
            padding: 10px;
            width: 250px;
        }
        button {
            padding: 10px 15px;
            margin: 10px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        </style>
</head>
<body>
    <h1>First Non Repeating Character</h1>

    <input type="text" id="userInput" placeholder="Enter text here">

    <br>

    <button onclick="checkNonRepeating()">Check Non Repeating Character</button>
    

    <div class="result" id="output"></div>
     
</body>
<script>
    function checkNonRepeating(){
        let input = document.getElementById("userInput").value;
        const freq = {};
        for(let char of input){
            freq[char] = (freq[char] || 0) + 1;
        }

        for(let char of input){
            if(freq[char] === 1){
                document.getElementById("output").textContent = `First Non Repeating Character: ${char}`;
                return;
            }
        }

        document.getElementById("output").textContent = "No unique character found";
    }
</script>
</html>
